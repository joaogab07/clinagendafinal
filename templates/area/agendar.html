{% extends "base.html" %}
{% block titulo %}Agendar consulta{% endblock %}
{% block largura %}estreito{% endblock %}
{% block conteudo %}
<h1>Agendar consulta</h1>
<form class="cartao formulario" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Profissional*
    <select name="profissional_id" required><option value="">Selecione...</option>
      {% for p in profissionais %}<option value="{{ p.id }}" {% if c and c.profissional_id|string == p.id|string %}selected{% endif %}>{{ p.nome }} ({{ p.especialidade }})</option>{% endfor %}
    </select></label>
  <label>Data e hora* <input type="datetime-local" name="data_hora" min="{{ agora }}" value="{{ c.data_hora if c else '' }}" required></label>
  <p class="dica-texto">A clínica atende das 07h às 20h. Cada consulta dura 30 minutos.</p>
  <label>Observações (opcional) <textarea name="observacoes" rows="3" placeholder="Ex.: retorno, primeira consulta...">{{ c.observacoes if c and c.observacoes else '' }}</textarea></label>
  <div class="botoes"><button class="btn">Agendar</button>
    <a class="btn secundario" href="{{ url_for('area_consultas') }}">Voltar</a></div>
</form>
{% endblock %}
